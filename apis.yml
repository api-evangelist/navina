aid: navina
name: Navina
description: 'Navina is a healthcare AI company whose clinician-facing copilot supports
  value-based care. It ingests data from electronic health records, health information
  exchanges, insurance claims and care-gap files, then reconciles it into a single
  "Patient Portrait" that surfaces risk-adjustment (HCC/RAF) insights, quality and
  care-gap management, ambient clinical documentation and network analytics at the
  point of care. Navina is delivered as an EHR-embedded application — integrated with
  Epic, Veradigm/Altera, athenahealth, eClinicalWorks and Cerner via HL7 v2/v3, FHIR
  and SMART on FHIR/OAuth2 — and is sold to physician groups, health systems, ACOs/MSOs
  and health plans. It is a consumer of EHR interoperability APIs rather than a publisher
  of a public developer API: no developer portal, documentation, API reference or
  machine-readable contract is published, and the api.navina.ai host is a fully
  authenticated backend.'
